[project]
name = "admission_engine"
version = "0.1.0"
description = "Admission Status Qualification & Documentation-Integrity Engine — Phase 1 synthetic silent-validation harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
admission-engine = "admission_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional PHI/PII model-redaction backend. NOT installed by default — the engine runs std-lib-only
# with the deterministic regex floor. Install ONLY inside the approved §8 PHI environment.
# Portable (CPU/CUDA, all platforms):
redaction-model = ["openmed[hf]>=0.1", "transformers>=4.40", "huggingface_hub>=0.23"]
# Apple-Silicon acceleration (optional, macOS only):
redaction-model-mlx = ["openmed[mlx]>=0.1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
